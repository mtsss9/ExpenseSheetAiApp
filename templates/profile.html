{% extends "base.html" %}

{% block title %}Your profile — Spendly{% endblock %}

{% block content %}

<section class="dashboard-section">
    <div class="dashboard-container">

        <div class="dashboard-header">
            <h1 class="dashboard-title">Your profile</h1>
            <p class="dashboard-subtitle">Member since {{ user.created_at.split(" ")[0] }}</p>
        </div>

        <div class="auth-card">
            <div class="form-group">
                <label>Full name</label>
                <p>{{ user.name }}</p>
            </div>
            <div class="form-group">
                <label>Email address</label>
                <p>{{ user.email }}</p>
            </div>
        </div>

        <div class="hero-dash-stats">
            <div class="hero-dash-stat">
                <span class="hero-dash-stat-label">Expenses logged</span>
                <span class="hero-dash-stat-value">{{ summary.count }}</span>
            </div>
            <div class="hero-dash-stat">
                <span class="hero-dash-stat-label">Total spent</span>
                <span class="hero-dash-stat-value">${{ "%.2f"|format(summary.total) }}</span>
            </div>
        </div>

    </div>
</section>

{% endblock %}
